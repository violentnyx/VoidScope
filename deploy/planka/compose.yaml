services:
  planka:
    build:
      context: .
    image: voidscope/planka:prebuild
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:1337"
    environment:
      BASE_URL: https://blanka.nyxaim.space
      DATABASE_URL: postgresql://planka:$${DATABASE_PASSWORD}@postgres/planka
      DATABASE_PASSWORD__FILE: /run/secrets/database_password
      SECRET_KEY__FILE: /run/secrets/secret_key
      DEFAULT_ADMIN_EMAIL: admin@nyxaim.space
      DEFAULT_ADMIN_NAME: Nyx
      DEFAULT_ADMIN_USERNAME: nyxai
      DEFAULT_ADMIN_PASSWORD__FILE: /run/secrets/admin_password
      DEFAULT_LANGUAGE: pt-BR
      TRUST_PROXY: "true"
    secrets:
      - database_password
      - secret_key
      - admin_password
    volumes:
      - planka-data:/app/data
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: planka
      POSTGRES_USER: planka
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planka -d planka"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  database_password:
    file: /var/lib/planka/secrets/database_password
  secret_key:
    file: /var/lib/planka/secrets/secret_key
  admin_password:
    file: /var/lib/planka/secrets/admin_password

volumes:
  planka-data:
  postgres-data:
